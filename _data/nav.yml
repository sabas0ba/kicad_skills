# Navigation for the site shell (_layouts/default.html).
#
# `page` is the Markdown file the entry points at; `url` is where Jekyll
# publishes it (README.md becomes its directory's index, everything else keeps
# its name with an .html suffix). Both are here so tests/test_docs.py can check
# that the two agree and that the target is a page the site actually publishes -
# a nav link into an excluded path would 404 exactly like a body link does.

- title: Overview
  page: README.md
  url: /

- title: Usage guides
  page: docs/guides/README.md
  url: /docs/guides/
  children:
    - title: Datasheet analysis
      page: docs/guides/datasheet-analysis.md
      url: /docs/guides/datasheet-analysis.html
    - title: SPICE simulation
      page: docs/guides/spice-simulation.md
      url: /docs/guides/spice-simulation.html
    - title: Schematic review
      page: docs/guides/kicad-schematic-review.md
      url: /docs/guides/kicad-schematic-review.html
    - title: Board review
      page: docs/guides/kicad-pcb-review.md
      url: /docs/guides/kicad-pcb-review.html
    - title: Fabrication output
      page: docs/guides/kicad-fabrication-output.md
      url: /docs/guides/kicad-fabrication-output.html
    - title: The container
      page: docs/guides/eda-environment.md
      url: /docs/guides/eda-environment.html

- title: Example output
  page: docs/examples/README.md
  url: /docs/examples/

- title: Working agreement
  page: AGENTS.md
  url: /AGENTS.html
