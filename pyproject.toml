[build-system]
# Pinned exactly, and mirrored with hashes in docker/build-backend.txt. uv
# resolves build-system requires outside uv.lock, so a ">=" floor here means
# "whatever PyPI serves today" - the one input the lock file cannot cover.
# tests/test_pinning.py enforces both the == and the agreement between the two.
# `wheel` is deliberately absent: setuptools has built wheels itself since 70.1,
# and listing it drags in packaging, which would need pinning too.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-toolkit"
version = "0.1.0"
description = "Container-based toolkit for circuit design: datasheets, SPICE simulation and KiCad review"
requires-python = ">=3.11"
# Loose bounds here; uv.lock pins the exact versions and hashes that the
# container and CI install.
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "ruff>=0.16.3",
]

[project.scripts]
eda = "eda_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "E501",     # line length is handled by the formatter
    "SIM105",   # contextlib.suppress is not always clearer than try/except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["eda_toolkit"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kicad: requires the kicad-cli binary (container only)",
    "ngspice: requires the ngspice binary (container only)",
]
filterwarnings = ["ignore::DeprecationWarning"]
