[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-toolkit"
version = "0.1.0"
description = "Container-based toolkit for circuit design: datasheets, SPICE simulation and KiCad review"
requires-python = ">=3.11"
# Loose bounds for library use. The container - and CI - install the exact,
# hash-pinned set from requirements.txt instead.
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "reportlab>=4.0",
]

[project.scripts]
eda = "eda_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kicad: requires the kicad-cli binary (container only)",
    "ngspice: requires the ngspice binary (container only)",
    "network: requires outbound network access",
]
filterwarnings = ["ignore::DeprecationWarning"]
