# The policy this example is held to, and what it is allowed to fail - each
# with the engineering argument, so a reviewer can disagree with something.
name = "motor-driver"
extends = "ai-generated"

[[waivers]]
rule = "readability.label_only"
reason = """The six logic nets are named at both ends on purpose: drawn as \
wires they lattice the power section with eight parallel crossings, which is \
the tangle the reviewer asked to remove. The power path, the charge pump and \
the motor outputs are all drawn copper; only the miscellaneous logic carries \
names, which is the convention the reviewer set for it."""

[[waivers]]
rule = "erc.pin_to_pin"
reason = """KiCad reads AISEN and BISEN as bidirectional pins - they are the \
sense inputs, and the package brings them out as general pins - and the GND \
they sit on carries the PWR_FLAG that tells ERC the rail is driven. Every \
board that ties an IO to a flagged rail gets this pair, because a PWR_FLAG is \
an assertion and not a driver. The connection itself is the datasheet's: with \
no PWM current regulation, the DRV8833 specifies AISEN and BISEN at ground. \
This disables current regulation: internal overcurrent fault protection is \
not a 0.5 A motor-current limiter. The sheet states that distinction. The \
alternative that satisfies ERC is a pair of zero-ohm links to ground, which \
is two parts in the bill of materials to quiet a warning about a connection \
nobody disputes."""

[[waivers]]
rule = "route.return_path"
reason = """The price of two layers on this board, measured and accepted. \
The three interfaces face three different edges because that is what the \
board is for - motors left, supply top right, logic along the bottom - so the \
four bridge outputs cross the front at power width between the driver and the \
motor terminals, and the four logic lanes cross under them on the back. Where \
those two families overlap, the front-side ground fill is in pieces, and the \
rule measures /AIN1 running 12.8 mm and /BIN2 10.4 mm over them against a \
10 mm limit. The fix that removes it outright is an inner ground plane, and a \
four-layer stack costs more per prototype run than this board's whole bill of \
materials. At 2.8 mm and 0.4 mm over the limit, on lanes carrying logic-level \
PWM into a driver's own inputs, the loop is worth the money saved. A design \
running these lanes faster, or one already paying for four layers, should not \
copy this waiver."""
