name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Makefile / bin/eda default (tests/test_pinning.py checks it).
  KICAD_VERSION: 10.0.4

jobs:
  unit:
    name: unit tests (host python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # exactly the interpreter the container ships, and the one
          # requirements.txt was locked for
          python-version: "3.13.5"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Show the resolved environment
        run: python -m pip list

      # No network is touched: the datasheet search/fetch tests use mocked HTTP,
      # and anything needing the real internet is behind the "network" marker.
      - name: Run tests
        run: python -m pytest -q -m "not kicad and not ngspice and not network" tests

  container:
    name: container suite (KiCad + ngspice)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build the image (base pinned by digest)
        run: make build

      - name: Report the toolchain
        run: ./bin/eda doctor

      - name: Full test-suite inside the container
        run: make test-docker

      - name: End-to-end smoke test
        run: make smoke

      - name: Render the example board (artefact for eyeballing)
        run: |
          ./bin/eda pcb render tests/fixtures/example_project -o artwork --dpi 150
          ./bin/eda sch render tests/fixtures/example_project -o artwork/schematic

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: example-artwork
          path: artwork/**/*.png
          retention-days: 7
          if-no-files-found: warn
