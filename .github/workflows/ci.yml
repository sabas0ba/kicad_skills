name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Makefile / bin/eda.sh default (tests/test_pinning.py checks it).
  KICAD_VERSION: 10.0.4

jobs:
  unit:
    name: unit tests (host python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          # exactly the interpreter the container ships
          python-version: "3.13.5"

      # Same pin the image uses, so CI and the container install identical trees.
      - name: Install uv (pinned by wheel hash)
        run: python -m pip install --require-hashes -r docker/uv-bootstrap.txt

      - name: Sync the locked environment
        run: uv sync --frozen --extra test
        env:
          UV_PYTHON: ${{ env.pythonLocation }}/bin/python
          UV_PYTHON_DOWNLOADS: never

      - name: Show the resolved environment
        run: uv pip list

      - name: Lint
        run: uv run --frozen --extra test ruff check --output-format=github .

      - name: Check formatting
        run: uv run --frozen --extra test ruff format --check .

      # Nothing here needs the internet - the toolkit itself never goes online.
      - name: Run tests
        run: uv run --frozen --extra test pytest -q -m "not kicad and not ngspice" tests

  container:
    name: container suite (KiCad + ngspice)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build the image (base pinned by digest)
        run: make build

      - name: Report the toolchain
        run: ./bin/eda.sh doctor

      - name: Full test-suite inside the container (with coverage)
        run: make test-coverage

      - name: End-to-end smoke test
        run: make smoke

      - name: Render the example board (artefact for eyeballing)
        run: |
          ./bin/eda.sh pcb render tests/fixtures/example_project -o artwork --dpi 150
          ./bin/eda.sh sch render tests/fixtures/example_project -o artwork/schematic

      - name: Upload rendered artwork
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: example-artwork
          path: artwork/**/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn
