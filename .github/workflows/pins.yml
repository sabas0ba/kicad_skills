name: Refresh pins

# The pins Dependabot cannot see: the KiCad base image digest and the pip / uv
# bootstrap wheels. Manual-only (workflow_dispatch): this repository does not
# allow Actions to open pull requests, so the job pushes the update to the
# `automation/refresh-pins` branch and links to the PR creation page in the run
# summary - opening the pull request stays a human act. The default KiCad
# release is never bumped automatically either; that changes what every review
# runs against, so it stays a deliberate act
# (tools/refresh_pins.py --write --set-default-kicad).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: check and propose pin updates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"

      - name: Refresh the hand-rolled pins
        id: refresh
        run: |
          python tools/refresh_pins.py --write | tee /tmp/pins.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the update branch
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/refresh-pins
          git commit -am "deps: refresh container pins"
          git push --force origin automation/refresh-pins

      - name: Write the run summary
        env:
          CHANGED: ${{ steps.refresh.outputs.changed }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            {
              echo '`tools/refresh_pins.py --write` found newer upstream artefacts:'
              echo
              echo '```'
              cat /tmp/pins.txt
              echo '```'
              echo
              echo 'The update is pushed to `automation/refresh-pins`. Open the pull request:'
              echo
              echo "https://github.com/$REPOSITORY/pull/new/automation/refresh-pins"
              echo
              echo 'CI rebuilds the image and runs the full suite against these pins.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'All pins are current - nothing to update.' >> "$GITHUB_STEP_SUMMARY"
          fi
